<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Location Every Second</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        margin: 0;
        padding: 20px;
      }

      h1 {
        text-align: center;
        color: #2c3e50;
      }

      .button-container {
        text-align: center;
        margin-bottom: 20px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        margin: 10px 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      #start-tracking-btn {
        background-color: #3498db;
        color: white;
      }

      #start-tracking-btn:hover {
        background-color: #2980b9;
      }

      #stop-tracking-btn {
        background-color: #e74c3c;
        color: white;
      }

      #stop-tracking-btn:hover {
        background-color: #c0392b;
      }

      #location-display {
        max-width: 600px;
        margin: 0 auto;
        padding: 10px;
      }

      .location {
        background-color: #ffffff;
        padding: 10px;
        margin-bottom: 8px;
        border-left: 5px solid #2ecc71;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Track Location</h1>
    <div class="button-container">
      <button id="start-tracking-btn">Start Tracking</button>
      <button id="stop-tracking-btn">Stop Tracking</button>
    </div>
    <div id="location-display"></div>

    <script>
      function generateRandomCarId() {
        const characters =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let carId = "";
        for (let i = 0; i < 10; i++) {
          const randomIndex = Math.floor(Math.random() * characters.length);
          carId += characters[randomIndex];
        }
        return carId;
      }

      const car_id = generateRandomCarId();

      let trackingInterval = null;

      function trackLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function (position) {
              const latitude = position.coords.latitude;
              const longitude = position.coords.longitude;

              const locationDiv = document.createElement("div");
              locationDiv.classList.add("location");
              locationDiv.innerText = `Latitude: ${latitude}, Longitude: ${longitude}`;

              document
                .getElementById("location-display")
                .appendChild(locationDiv);

              fetch("https://get-location-7f467195d6ad.hosted.ghaymah.systems/track-location", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  car_id: car_id,
                  latitude: latitude,
                  longitude: longitude,
                }),
              });
            },
            function (error) {
              const locationDiv = document.createElement("div");
              locationDiv.classList.add("location");
              locationDiv.innerText =
                "Error fetching location: " + error.message;
              document
                .getElementById("location-display")
                .appendChild(locationDiv);
            }
          );
        } else {
          const locationDiv = document.createElement("div");
          locationDiv.classList.add("location");
          locationDiv.innerText =
            "Geolocation is not supported by this browser.";
          document.getElementById("location-display").appendChild(locationDiv);
        }
      }

      document
        .getElementById("start-tracking-btn")
        .addEventListener("click", function () {
          if (!trackingInterval) {
            trackingInterval = setInterval(trackLocation, 1000);
          }
        });

      document
        .getElementById("stop-tracking-btn")
        .addEventListener("click", function () {
          if (trackingInterval) {
            clearInterval(trackingInterval);
            trackingInterval = null;
          }
        });
    </script>
  </body>
</html>
